name: snapshot
# Records reference prices every 10 min and raw off-hours payloads, committing each tick
# to the `snapshots` branch (never the code branch).
#
# GitHub's cron did not fire at all for this new repo (only the manual run landed on
# 2026-09-25), so this workflow does not depend on it: each run loops for ~5.5 h and then
# dispatches its own successor. The hourly schedule is only a watchdog that restarts the
# chain if it ever breaks; `concurrency` makes a watchdog start wait for the running loop.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
concurrency:
  group: snapshot
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
      - uses: actions/setup-node@v4
        with:
          node-version-file: code/.nvmrc
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
        working-directory: code
      - name: Check out the snapshots branch (create it on first run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" snapshots >/dev/null; then
            git clone --depth 1 --branch snapshots "$url" store
          else
            git init -b snapshots store
            git -C store remote add origin "$url"
            printf '# snapshots\n\nWritten by .github/workflows/snapshot.yml. Do not edit by hand.\n' > store/README.md
          fi
          git -C store config user.name "stamp-snapshot"
          git -C store config user.email "stamp-snapshot@users.noreply.github.com"
      - name: Tick every 10 minutes for ~5.5 hours
        run: |
          end=$(( $(date +%s) + 330*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            (cd code && npx tsx scripts/snapshot.ts --out ../store/data) || echo "tick failed"
            (
              cd store
              git add -A
              if ! git diff --cached --quiet; then
                git commit -q -m "snapshot $(date -u +%FT%TZ)"
                for i in 1 2 3 4; do
                  git push -q origin HEAD:snapshots && break
                  sleep $((2**i))
                  git pull -q --rebase --depth 1 origin snapshots || true
                done
              fi
            ) || echo "push failed"
            now=$(date +%s)
            sleep $(( 600 - now % 600 + 5 ))
          done
      - name: Start the next loop
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run snapshot.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
